spring:
  application:
    name: customer-docker-compose-postgres

  datasource:
    url: jdbc:postgresql://postgres:5432/customer-docker-compose-db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: 8080